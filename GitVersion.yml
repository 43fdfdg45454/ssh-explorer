# Trunk-based versioning on master. Versions are derived from the last v* tag
# and Conventional Commits messages:
#   feat:                   -> minor
#   fix|perf|refactor|build|chore: -> patch
#   <type>!: / BREAKING CHANGE -> major
#   docs|style|test|ci:     -> no bump (no release)
# Without tags the first computed version is 0.1.0 (feat commits since 0.0.0).
workflow: GitHubFlow/v1
mode: ContinuousDeployment
tag-prefix: 'v'
commit-message-incrementing: Enabled
major-version-bump-message: '\+semver:\s?(breaking|major)|^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE:'
minor-version-bump-message: '\+semver:\s?(feature|minor)|^feat(\([^)]*\))?:'
patch-version-bump-message: '\+semver:\s?(fix|patch)|^(fix|perf|refactor|build|chore)(\([^)]*\))?:'
no-bump-message: '\+semver:\s?(none|skip)|^(docs|style|test|ci)(\([^)]*\))?:'
branches:
  main:
    regex: ^master$|^main$
    label: ''
    increment: Patch
    is-main-branch: true
